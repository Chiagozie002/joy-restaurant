<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | Joy Restaurant Admin</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.0.0/css/all.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet"><link href="css/cpanel.css" rel="stylesheet"></head>
<body class="auth-page"><main class="login-wrap"><div class="glass">
<div class="text-center mb-4"><div class="brand fs-2"><i class="fa-solid fa-utensils me-2"></i>Joy Restaurant</div><p class="text-white-50 mb-0">Admin sign in</p></div>
<form id="loginForm" novalidate>
 <div class="mb-3"><label class="form-label" for="identifier">Email or username</label><input class="form-control" id="identifier" name="identifier" autocomplete="username"><div class="invalid-msg" data-err="identifier"></div></div>
 <div class="mb-3"><label class="form-label" for="password">Password</label><div class="input-group"><input class="form-control" id="password" name="password" type="password" autocomplete="current-password">
  <button class="btn btn-outline-warning" type="button" id="showPw" aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div><div class="invalid-msg" data-err="password"></div></div>
 <button class="btn-joy w-100" type="submit">Log in</button></form>
<p class="small text-white-50 text-center mt-3 mb-0">Demo login: admin / Joy@12345</p></div></main>
<div id="toastBox"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script><script src="js/admin-data.js"></script><script src="js/admin-api.js"></script><script src="js/cpanel.js"></script><script src="js/login.js"></script></body></html>
