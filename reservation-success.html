<body>
<div class="success-wrap"><i class="dot" style="left:0.0%;animation-duration:4s;animation-delay:-0s"></i><i class="dot" style="left:5.3%;animation-duration:5s;animation-delay:-1s"></i><i class="dot" style="left:10.6%;animation-duration:6s;animation-delay:-2s"></i><i class="dot" style="left:15.899999999999999%;animation-duration:7s;animation-delay:-3s"></i><i class="dot" style="left:21.2%;animation-duration:8s;animation-delay:-4s"></i><i class="dot" style="left:26.5%;animation-duration:4s;animation-delay:-5s"></i><i class="dot" style="left:31.799999999999997%;animation-duration:5s;animation-delay:-6s"></i><i class="dot" style="left:37.1%;animation-duration:6s;animation-delay:-0s"></i><i class="dot" style="left:42.4%;animation-duration:7s;animation-delay:-1s"></i><i class="dot" style="left:47.699999999999996%;animation-duration:8s;animation-delay:-2s"></i><i class="dot" style="left:53.0%;animation-duration:4s;animation-delay:-3s"></i><i class="dot" style="left:58.3%;animation-duration:5s;animation-delay:-4s"></i><i class="dot" style="left:63.599999999999994%;animation-duration:6s;animation-delay:-5s"></i><i class="dot" style="left:68.89999999999999%;animation-duration:7s;animation-delay:-6s"></i><i class="dot" style="left:74.2%;animation-duration:8s;animation-delay:-0s"></i><i class="dot" style="left:79.5%;animation-duration:4s;animation-delay:-1s"></i><i class="dot" style="left:84.8%;animation-duration:5s;animation-delay:-2s"></i><i class="dot" style="left:90.1%;animation-duration:6s;animation-delay:-3s"></i><i class="dot" style="left:95.39999999999999%;animation-duration:7s;animation-delay:-4s"></i><i class="dot" style="left:0.7000000000000028%;animation-duration:8s;animation-delay:-5s"></i>
<div class="text-center position-relative" style="max-width:480px"><div class="check"><i class="fa-solid fa-check"></i></div>
<h1 class="mt-4">Reservation Request Received!</h1>
<div class="card-joy p-3 my-4 text-start" style="background:rgba(0,0,0,.35);color:#fff" id="details"></div>
<p>Our team will review your request and update its status. Status: <span class="badge bg-warning text-dark">Pending</span></p>
<a href="index.html" class="btn-joy">Return home</a></div></div>
<div id="toastBox"></div>
<script>
/* The reservation details come from the server (it remembers which reservation THIS browser just made).
   If there is no backend (browser-only demo mode) it falls back to demo data kept in sessionStorage. */
document.documentElement.dataset.theme = "dark";
const box = document.getElementById("details");
const show = d => box.innerHTML = d ? `<div>Reference: <b></b></div><div>Date: ${d.date}</div><div>Time: ${d.time}</div><div>Guests: ${d.guests}</div>`
  : "No reservation found. Please make a new request.";
(async () => {
  let d = null;
  try { const r = await (await fetch("ajax/get-reservation-confirmation.php", {credentials: "same-origin"})).json(); if (r.success) d = r.data; } catch {}
  if (!d) { try { d = JSON.parse(sessionStorage.getItem("joy-last-reservation") || "null"); } catch {} }
  show(d); if (d) box.querySelector("b").textContent = d.reference;     // textContent: never inject server text as HTML
})();
</script></body></html>
